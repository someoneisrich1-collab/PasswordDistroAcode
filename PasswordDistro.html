<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arfaosroot - Root Access Enforced</title>
    <style>
        :root {
            --bg: #07090e;
            --term-bg: rgba(11, 14, 22, 0.96);
            --cyan: #00e5ff;
            --purple: #8b5cf6;
            --green: #10b981;
            --yellow: #f59e0b;
            --red: #ef4444;
            --text: #e2e8f0;
            --muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
        }

        body {
            background: radial-gradient(circle at 50% 10%, #171b30, var(--bg) 85%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 8px;
            color: var(--text);
        }

        .window {
            width: 100%;
            max-width: 980px;
            height: 95vh;
            background-color: var(--term-bg);
            border-radius: 12px;
            box-shadow: 0 0 35px rgba(239, 68, 68, 0.2), 0 25px 60px rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .title-bar {
            background: #0f121d;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            user-select: none;
            border-bottom: 1px solid rgba(239, 68, 68, 0.3);
        }

        .dots { display: flex; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .dot-red { background: var(--red); box-shadow: 0 0 8px var(--red); }
        .dot-yellow { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
        .dot-green { background: var(--green); box-shadow: 0 0 8px var(--green); }

        .title {
            margin-left: auto;
            margin-right: auto;
            font-size: 13px;
            letter-spacing: 1.5px;
            color: var(--red);
            font-weight: bold;
        }

        .terminal {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            font-size: 13.5px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .input-row {
            display: flex;
            align-items: center;
            margin-top: 6px;
        }

        .prompt {
            color: var(--cyan);
            font-weight: bold;
            margin-right: 8px;
            white-space: nowrap;
        }
        .prompt .user { color: var(--green); }
        .prompt.root .user { color: var(--red); }
        .prompt .path { color: var(--purple); }

        input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: inherit;
            font-size: inherit;
            width: 100%;
        }

        .cyan { color: var(--cyan); font-weight: bold; }
        .purple { color: var(--purple); }
        .green { color: var(--green); }
        .yellow { color: var(--yellow); }
        .red { color: var(--red); }
        .muted { color: var(--muted); }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <div class="dots">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
        </div>
        <span class="title" id="win-title">ARFAOSROOT :: PRIVILEGE ENFORCED</span>
    </div>

    <div class="terminal" id="terminal" onclick="document.getElementById('cmd-input').focus()">
        <div><span class="red">SECURITY NOTICE: STRICT ROOT ACCESS ENFORCEMENT ACTIVE</span></div>
        <div>Non-privileged users have restricted execution policies.</div>
        <div>Default root credentials: key = '<span class="yellow">root</span>' (Type '<span class="cyan">su</span>' to escalate).</div>
        <br>
        <div id="history"></div>
        <div class="input-row">
            <span class="prompt" id="prompt-label"><span class="user">guest</span>@<span class="cyan">arfaosroot</span> <span class="path" id="cur-path">~</span> <span id="prompt-sym">$</span></span>
            <input type="text" id="cmd-input" autofocus autocomplete="off" autocapitalize="none" spellcheck="false">
        </div>
    </div>
</div>

<script>
    const historyContainer = document.getElementById("history");
    const input = document.getElementById("cmd-input");
    const terminal = document.getElementById("terminal");
    const curPathEl = document.getElementById("cur-path");
    const promptLabel = document.getElementById("prompt-label");
    const promptSym = document.getElementById("prompt-sym");
    const winTitle = document.getElementById("win-title");

    let isRoot = false;
    let awaitingPassword = false;
    let currentDir = "~";
    let commandLog = [];
    let logIdx = -1;

    let packages = [
        "arfaosroot-core", "arfaosroot-kernel-zen", "arfaosroot-shell", 
        "hyprland-arfa", "waybar", "neofetch", "gcc", "python3", 
        "git", "openssh", "curl", "vim", "htop", "bash"
    ];

    let vfs = {
        "~": {
            type: "dir",
            children: {
                "projects": {
                    type: "dir",
                    children: {
                        "main.py": { type: "file", content: "print('Root authenticated execution.')" },
                        "kernel.c": { type: "file", content: "#include <stdio.h>\nint main() { return 0; }" }
                    }
                },
                "sys-kernel.lock": { type: "file", content: "LOCKED_CONTAINER_KEY" }
            }
        },
        "/": {
            type: "dir",
            children: {
                "bin": { type: "dir", children: {} },
                "root": { type: "dir", children: { "secret.key": { type: "file", content: "ARFAOSROOT_SECURE_TOKEN_2026" } } },
                "etc": { type: "dir", children: { "hostname": { type: "file", content: "arfaosroot" } } }
            }
        }
    };

    function updatePrompt() {
        if (isRoot) {
            promptLabel.className = "prompt root";
            promptLabel.innerHTML = `<span class="user">root</span>@<span class="cyan">arfaosroot</span> <span class="path">${currentDir}</span> #`;
            winTitle.innerText = "ARFAOSROOT :: ROOT SHELL (#)";
            winTitle.style.color = "var(--green)";
        } else {
            promptLabel.className = "prompt";
            promptLabel.innerHTML = `<span class="user">guest</span>@<span class="cyan">arfaosroot</span> <span class="path">${currentDir}</span> $`;
            winTitle.innerText = "ARFAOSROOT :: RESTRICTED GUEST ($)";
            winTitle.style.color = "var(--red)";
        }
    }

    function getDirObj(path) {
        if (path === "~") return vfs["~"];
        if (path === "/") return vfs["/"];
        let parts = path.split("/").filter(p => p && p !== "~");
        let cur = path.startsWith("~") ? vfs["~"] : vfs["/"];
        for (let p of parts) {
            if (cur.children && cur.children[p]) cur = cur.children[p];
        }
        return cur;
    }

    const arfaLogo = `
<span class="cyan">                 /\\                 </span><span class="red"><b>root@arfaosroot (UID: 0)</b></span>
<span class="cyan">                /  \\                </span>-------------------------
<span class="cyan">               / /\\ \\               </span><span class="yellow">OS:</span> arfaosroot GNU/Linux x86_64
<span class="cyan">              / /  \\ \\              </span><span class="yellow">Security Level:</span> SUPERUSER ENFORCED
<span class="cyan">             / / /\\ \\ \\             </span><span class="yellow">Kernel:</span> 6.11.0-arfaosroot-zen+
<span class="purple">            / / /__\\ \\ \\            </span><span class="yellow">Privilege:</span> FULL ROOT CONTROL
<span class="purple">           / / /____\\ \\ \\           </span><span class="yellow">Packages:</span> ${packages.length} (arfa-pkg)
<span class="purple">          /_/ /      \\ \\_\\          </span><span class="yellow">Shell:</span> arfaosroot-sh (authenticated)
<span class="purple">         /___/        \\___\\         </span><span class="yellow">Memory:</span> 2480MiB / 16384MiB
`;

    input.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            const rawVal = input.value.trim();
            const fullCmd = input.value;
            input.value = "";

            if (awaitingPassword) {
                verifyPassword(rawVal);
                return;
            }

            if (fullCmd.trim()) {
                commandLog.push(fullCmd);
                logIdx = commandLog.length;
            }

            if (!rawVal) {
                printHistory(promptLabel.innerHTML);
                return;
            }

            printHistory(promptLabel.innerHTML + " " + fullCmd);
            runCommand(rawVal);

            setTimeout(() => { terminal.scrollTop = terminal.scrollHeight; }, 10);
        } else if (e.key === "ArrowUp") {
            if (logIdx > 0) {
                logIdx--;
                input.value = commandLog[logIdx];
            }
        } else if (e.key === "ArrowDown") {
            if (logIdx < commandLog.length - 1) {
                logIdx++;
                input.value = commandLog[logIdx];
            } else {
                logIdx = commandLog.length;
                input.value = "";
            }
        }
    });

    function printHistory(text) {
        const div = document.createElement("div");
        div.innerHTML = text;
        historyContainer.appendChild(div);
    }

    function verifyPassword(pass) {
        awaitingPassword = false;
        input.type = "text";
        if (pass.toLowerCase() === "root" || pass.toLowerCase() === "arfa") {
            isRoot = true;
            printHistory("<span class='green'>✔ Authentication successful. Root privilege granted.</span>");
            printHistory(arfaLogo);
        } else {
            printHistory("<span class='red'>su: Authentication failure. Permission denied.</span>");
        }
        updatePrompt();
    }

    function requireRoot(actionCallback) {
        if (!isRoot) {
            printHistory("<span class='red'>Access denied: root privilege required. Execute 'su' first.</span>");
            return;
        }
        actionCallback();
    }

    function runCommand(raw) {
        let parts = raw.split(" ").filter(p => p.length > 0);
        let cmd = parts[0].toLowerCase();
        let args = parts.slice(1);

        if (cmd === "su" || (cmd === "sudo" && (args[0] === "su" || args.length === 0))) {
            if (isRoot) {
                printHistory("Already running with root superuser privileges.");
            } else {
                awaitingPassword = true;
                printHistory("Password for root: ");
                input.type = "password";
            }
            return;
        }

        if (cmd === "exit") {
            if (isRoot) {
                isRoot = false;
                printHistory("<span class='yellow'>Logged out from superuser. Returning to guest shell.</span>");
                updatePrompt();
            } else {
                printHistory("Cannot exit baseline shell.");
            }
            return;
        }

        let folder = getDirObj(currentDir);

        switch (cmd) {
            case "help":
                printHistory(`<b>ARFAOSROOT SECURITY INTERFACE:</b>
 - <b>su / sudo su</b>         : Authenticate and escalate to superuser (root)
 - <b>exit</b>                : Drop back down to unprivileged shell
 - <b>whoami / id</b>         : Display user privilege state
 - <b>neofetch</b>            : View system hardware specs
 - <b>clear</b>               : Clear screen buffer
<i>(Note: All system operations like arfa-pkg, rm, mkdir, nano, python, df, uname require active root access).</i>`);
                break;

            case "whoami":
                printHistory(isRoot ? "<span class='red bold'>root</span>" : "guest");
                break;

            case "id":
                printHistory(isRoot 
                    ? "uid=0(root) gid=0(root) groups=0(root),1(bin),10(wheel)" 
                    : "uid=1000(guest) gid=1000(guest) groups=1000(guest)");
                break;

            case "clear":
                historyContainer.innerHTML = "";
                break;

            case "ls":
                if (!folder.children || Object.keys(folder.children).length === 0) {
                    printHistory("<span class='yellow'>(empty directory)</span>");
                } else {
                    let items = Object.keys(folder.children).map(name => {
                        let item = folder.children[name];
                        return item.type === "dir" ? `<span class="cyan">${name}/</span>` : `<span>${name}</span>`;
                    });
                    printHistory(items.join("  "));
                }
                break;

            case "cd":
                let tgt = args[0] || "~";
                if (tgt === "/" || tgt === "/root") {
                    requireRoot(() => {
                        currentDir = tgt;
                        updatePrompt();
                    });
                } else if (tgt === "~") {
                    currentDir = "~";
                    updatePrompt();
                } else if (folder.children && folder.children[tgt] && folder.children[tgt].type === "dir") {
                    currentDir = currentDir + "/" + tgt;
                    updatePrompt();
                } else {
                    printHistory(`<span class="red">cd: no such file or directory: ${tgt}</span>`);
                }
                break;

            case "neofetch":
                requireRoot(() => printHistory(arfaLogo));
                break;

            case "mkdir":
                requireRoot(() => {
                    if (!args[0]) printHistory("<span class='red'>mkdir: missing operand</span>");
                    else {
                        folder.children[args[0]] = { type: "dir", children: {} };
                        printHistory(`<span class='green'>✔ Root directory created: ${args[0]}</span>`);
                    }
                });
                break;

            case "touch":
                requireRoot(() => {
                    if (!args[0]) printHistory("<span class='red'>touch: missing operand</span>");
                    else {
                        folder.children[args[0]] = { type: "file", content: "" };
                        printHistory(`<span class='green'>✔ Root file created: ${args[0]}</span>`);
                    }
                });
                break;

            case "nano":
                requireRoot(() => {
                    if (!args[0]) printHistory("<span class='yellow'>Usage: nano &lt;file&gt; &lt;text&gt;</span>");
                    else {
                        folder.children[args[0]] = { type: "file", content: args.slice(1).join(" ") };
                        printHistory(`<span class='green'>✔ File saved with root permissions: ${args[0]}</span>`);
                    }
                });
                break;

            case "cat":
                if (!args[0]) {
                    printHistory("<span class='red'>cat: missing operand</span>");
                } else if (folder.children && folder.children[args[0]]) {
                    if (folder.children[args[0]].type === "file") {
                        if (args[0].includes("key") || args[0].includes("lock")) {
                            requireRoot(() => printHistory(folder.children[args[0]].content));
                        } else {
                            printHistory(folder.children[args[0]].content);
                        }
                    } else {
                        printHistory(`<span class='red'>cat: ${args[0]}: Is a directory</span>`);
                    }
                } else {
                    printHistory(`<span class='red'>cat: ${args[0]}: No such file</span>`);
                }
                break;

            case "rm":
                requireRoot(() => {
                    if (!args[0]) printHistory("<span class='red'>rm: missing operand</span>");
                    else if (folder.children && folder.children[args[0]]) {
                        delete folder.children[args[0]];
                        printHistory(`<span class='yellow'>✔ Root purge: ${args[0]} deleted</span>`);
                    } else {
                        printHistory(`<span class='red'>rm: cannot remove '${args[0]}': Not found</span>`);
                    }
                });
                break;

            case "uname":
            case "df":
            case "free":
            case "top":
            case "ps":
                requireRoot(() => {
                    printHistory(`Executing privileged kernel call for [${cmd}]...
Status: Superuser check passed. Kernel ring 0 access enabled.`);
                });
                break;

            case "python":
            case "python3":
                requireRoot(() => {
                    let code = args.slice(1).join(" ").replace(/^["']|["']$/g, '');
                    printHistory(`[Privileged Python Runtime]\nExecuting: ${code || "interactive ready"}`);
                });
                break;

            case "arfa-pkg":
                requireRoot(() => {
                    if (args[0] === "install" && args[1]) {
                        packages.push(args[1]);
                        printHistory(`<span class='green'>✔ Package '${args[1]}' installed successfully under root environment.</span>`);
                    } else {
                        printHistory("arfa-pkg: root operation executed.");
                    }
                });
                break;

            default:
                if (!isRoot) {
                    printHistory(`<span class="red">Permission denied: '${cmd}' requires root privileges. Type 'su' to login as root.</span>`);
                } else {
                    printHistory(`[Root binary exec] <span class="green">${cmd}</span> PID: ${Math.floor(Math.random() * 8000 + 1000)} (Ring-0)`);
                }
                break;
        }
    }
</script>
</body>
</html>
